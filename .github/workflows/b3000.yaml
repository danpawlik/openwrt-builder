---
name: Gl.iNet b3000

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    permissions:
      contents: write
    with:
      repository: openwrt/openwrt
      branch: main
      device_config: qualcommax/ipq50xx/gl-b3000
      role_config: common/dumb_ap
      extra_configs: |
        common/openssl
        common/snapshot
      target_path: bin/targets/qualcommax/ipq50xx
      release_prefix: Ipq5018
      title: OpenWrt Gl.iNet B3000 - vanila
