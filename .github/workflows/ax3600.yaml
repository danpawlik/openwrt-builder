---
name: Xiaomi AX3600 - clean OpenWRT

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    permissions:
      contents: write
    with:
      repository: openwrt/openwrt
      branch: main
      device_config: qualcommax/ipq807x/ax3600
      role_config: common/main-router
      extra_configs: common/snapshot-short
      target_path: bin/targets/qualcommax/ipq807x
      release_prefix: Mediatek_qualcomm_ax3600
      title: OpenWRT AX3600
      use_openssl: true
