---
# Based on https://github.com/JuliusBairaktaris/Qualcommax_NSS_Builder/blob/main/.github/workflows/build.yaml
name: Xiaomi 4a-giga

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    permissions:
      contents: write
    with:
      repository: openwrt/openwrt
      branch: main
      device_config: ramips/mt7621/4a-giga
      role_config: common/dumb_ap
      extra_configs: common/snapshot-short
      target_path: bin/targets/ramips/mt7621
      release_prefix: Mediatek_mt7621_4agiga
      title: OpenWRT 4a-giga
      use_openssl: true
