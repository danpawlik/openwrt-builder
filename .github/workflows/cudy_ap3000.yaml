---
name: Cudy ap3000

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    permissions:
      contents: write
    with:
      repository: openwrt/openwrt
      branch: main
      device_config: mediatek/mt7981b/cudy_ap3000
      role_config: common/parents
      extra_configs: common/snapshot
      target_path: bin/targets/mediatek/filogic
      release_prefix: Mediatek_mt7981b_ap3000
      title: OpenWRT ap3000
      description: Updated prebuilt images for Cudy ap3000
