---
name: Unifi 6 lite

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    permissions:
      contents: write
    with:
      repository: openwrt/openwrt
      branch: main
      device_config: ramips/mt7621/u6-lite
      role_config: common/parents
      extra_configs: common/snapshot-short
      target_path: bin/targets/ramips/mt7621
      release_prefix: Ramips_mt7621_u6lite
      title: OpenWRT Unifi 6 Lite
      disable_lto: true
