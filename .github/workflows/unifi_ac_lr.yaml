---
name: Unifi AP AC LR

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    permissions:
      contents: write
    with:
      repository: openwrt/openwrt
      branch: main
      device_config: ath79/generic/uap-ac-lr
      role_config: common/parents-minimal
      extra_configs: common/snapshot-short
      target_path: bin/targets/ath79/generic
      release_prefix: Ath79_uapaclr
      title: OpenWRT Unifi AP AC LR
      disable_lto: true
      use_openssl: true
